apiVersion: argoproj.io/v1alpha1

kind: Application


metadata:

  name: student-app-prod

  namespace: argocd


  finalizers:

    - resources-finalizer.argocd.argoproj.io


spec:

  project: default


  source:

    repoURL: https://github.com/Divya09849/student-app-gitops.git

    targetRevision: main

    path: helm/student-app


    helm:

      releaseName: student-app-prod

      valueFiles:

        - values-prod.yaml


  destination:

    server: https://kubernetes.default.svc

    namespace: student-app-prod


  syncPolicy:

    syncOptions:

      - CreateNamespace=true