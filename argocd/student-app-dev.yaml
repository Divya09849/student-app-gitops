apiVersion: argoproj.io/v1alpha1

kind: Application


metadata:

  name: student-app-dev

  namespace: argocd


  finalizers:

    - resources-finalizer.argocd.argoproj.io


spec:

  project: default


  source:

    repoURL: https://github.com/Divya09849/student-app-gitops.git

    targetRevision: main

    path: helm/student-app


    helm:

      releaseName: student-app-dev

      valueFiles:

        - values-dev.yaml


  destination:

    server: https://kubernetes.default.svc

    namespace: student-app-dev


  syncPolicy:

    automated:

      enabled: true

      prune: true

      selfHeal: true


    syncOptions:

      - CreateNamespace=true