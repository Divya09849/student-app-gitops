replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_REPOSITORY_URL
  tag: "v1"
  pullPolicy: IfNotPresent


nameOverride: ""

fullnameOverride: ""


application:
  environment: dev
  version: "1.0.0"


serviceAccount:
  create: true

  automount: false

  annotations: {}

  name: ""


podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8000"


podLabels: {}


podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

  seccompProfile:
    type: RuntimeDefault


securityContext:
  allowPrivilegeEscalation: false

  readOnlyRootFilesystem: true

  runAsNonRoot: true

  runAsUser: 10001

  capabilities:
    drop:
      - ALL


service:
  type: ClusterIP

  port: 80

  targetPort: 8000


containerPort: 8000


resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 256Mi


livenessProbe:
  enabled: true

  path: /health

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 3

  failureThreshold: 3


readinessProbe:
  enabled: true

  path: /ready

  initialDelaySeconds: 5

  periodSeconds: 5

  timeoutSeconds: 3

  failureThreshold: 3


ingress:
  enabled: false

  className: ""

  annotations: {}

  hosts:
    - host: student-app.example.com

      paths:
        - path: /
          pathType: Prefix

  tls: []


nodeSelector: {}

tolerations: []

affinity: {}