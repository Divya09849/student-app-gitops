apiVersion: v1

kind: Service

metadata:

  name: {{ include "student-app.fullname" . }}

  labels:

    {{- include "student-app.labels" . | nindent 4 }}


spec:

  type: {{ .Values.service.type }}


  ports:

    - name: http

      port: {{ .Values.service.port }}

      targetPort: {{ .Values.service.targetPort }}

      protocol: TCP


  selector:

    {{- include "student-app.selectorLabels" . | nindent 4 }}